name: BeadWorks
options:
  bundleIdPrefix: com.beadworks
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    ENABLE_PREVIEWS: YES

targets:
  BeadWorks:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BeadWorks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.beadworks.native
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: 拼豆工坊
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "选择照片以生成拼豆模板"
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "将拼豆成品保存到相册以便分享"

  BeadWorksTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BeadWorksTests
    dependencies:
      - target: BeadWorks
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.beadworks.native.tests

  BeadWorksUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BeadWorksUITests
    dependencies:
      - target: BeadWorks
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.beadworks.native.uitests

schemes:
  BeadWorks:
    build:
      targets:
        BeadWorks: all
        BeadWorksTests: [test]
        BeadWorksUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BeadWorksTests
        - BeadWorksUITests
    archive:
      config: Release
